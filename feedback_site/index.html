<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JTAC 9-Line Review — Tactical Display</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  .map-svg { background: #0a1929; }
  .map-svg .grid-line { stroke: #1e3a5f; stroke-width: 0.4; }
  .map-svg text { font-family: ui-monospace, Menlo, monospace; }
  .nine-line {
    background: #0a1929; color: #cbd5e1; padding: 0.875rem 1rem;
    border-radius: 0.375rem; font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 0.8rem; line-height: 1.55; border: 1px solid #1e3a5f;

  .nine-line .label { color: #fbbf24; display: inline-block; min-width: 6rem; }
  .nine-line .restriction { color: #fca5a5; }
  .grade-btn { transition: all 0.1s; cursor: pointer; user-select: none; }
  .grade-btn.up.on    { background: #16a34a; color: white; border-color: #16a34a; }
  .grade-btn.down.on  { background: #dc2626; color: white; border-color: #dc2626; }
  .grade-btn.unsure.on{ background: #f59e0b; color: white; border-color: #f59e0b; }
  .tab-btn { white-space: nowrap; transition: all 0.1s; }
  .tab-btn.active { background: #0f172a; color: white; }
  .trace-step {
    border-left: 3px solid #475569; padding: 0.5rem 0.875rem; margin: 0.25rem 0;
    background: #f8fafc; font-size: 0.8rem;

  .trace-step.passed   { border-left-color: #22c55e; }
  .trace-step.flagged  { border-left-color: #eab308; }
  .trace-step.blocked  { border-left-color: #ef4444; }
  .trace-step.override { border-left-color: #8b5cf6; }
  .tactical-panel {
    background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 0.5rem;
  }
  .tactical-header {
    background: #1e293b; color: #fbbf24; padding: 0.5rem 1rem;
    font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem;
    border-bottom: 1px solid #334155; letter-spacing: 0.05em;

<body class="bg-slate-50 min-h-screen pb-12">

<header class="bg-slate-900 text-white border-b-4 border-amber-400">

      <div class="flex flex-col gap-2">

        <button id="copyBtn" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded text-sm">Copy to clipboard</button>
        <button id="resetBtn" class="bg-red-700 hover:bg-red-600 text-white px-4 py-2 rounded text-xs">Reset all</button>
      </div>
    </div>
  </div>
</header>

<nav class="max-w-7xl mx-auto px-6 sticky top-0 bg-slate-50 z-10 border-b border-slate-200">
  <div class="flex gap-1 overflow-x-auto py-3" id="tabs"></div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-6" id="main"></main>

<footer class="border-t border-slate-200 mt-12 py-6 text-center text-sm text-slate-500">
  Decision tree v1 · WinTAK-style tactical view · doctrine in <span class="mono">/JTAC_Manuals/REFERENCES/</span>
</footer>

<script>
// ──────────────────────────────────────────────────────────────────────────
// TACTICAL MAP RENDERER
// All entities placed via bearing (0=N, 90=E) + distance from map center
// ──────────────────────────────────────────────────────────────────────────

const MAP_W = 800, MAP_H = 460;

function bearingToXY(bearing_deg, dist_m, m_per_px) {
  const rad = bearing_deg * Math.PI / 180;
  const dx = Math.sin(rad) * dist_m / m_per_px;
  const dy = -Math.cos(rad) * dist_m / m_per_px;
  return [MAP_W / 2 + dx, MAP_H / 2 + dy];
}

function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

function symbolSvg(entity, x, y, m_per_px) {
  const t = entity.type;
  const lbl = entity.label || '';
  const sub = entity.sublabel || '';
  let body = '';

  if (t === 'target') {
    // Red diamond (hostile)
    body = `
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">ENY</text>
    `;
    if (entity.moving) {
      // Velocity arrow
      const headRad = (entity.heading_deg || 0) * Math.PI / 180;
      const ax = Math.sin(headRad) * 32;
      const ay = -Math.cos(headRad) * 32;
      body += `
        <line x1="0" y1="0" x2="${ax}" y2="${ay}" stroke="#fca5a5" stroke-width="2.5" marker-end="url(#vel)"/>
      `;
    }
  } else if (t === 'friendly') {
    // Blue rectangle with diagonals (mil-std friendly)
    body = `
      <rect x="-13" y="-11" width="26" height="22" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
      <line x1="-13" y1="-11" x2="13" y2="11" stroke="#3b82f6" stroke-width="2"/>
      <line x1="-13" y1="11" x2="13" y2="-11" stroke="#3b82f6" stroke-width="2"/>
    `;
  } else if (t === 'civilian' || t === 'protected') {
    // Green octagon for protected
    body = `
      <polygon points="-9,-13 9,-13 13,-9 13,9 9,13 -9,13 -13,9 -13,-9" fill="#15803d" stroke="#86efac" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">${entity.icon || 'CIV'}</text>
    `;
  } else if (t === 'threat') {
    body = `
      <circle r="13" fill="none" stroke="#dc2626" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">⚠</text>
    `;
  } else if (t === 'aircraft') {
    body = `
      <polygon points="0,-15 8,8 0,4 -8,8" fill="#3b82f6" stroke="#dbeafe" stroke-width="1.5"/>
    `;
  } else if (t === 'unknown') {
    // Yellow square with ?
    body = `
      <rect x="-13" y="-13" width="26" height="26" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="0" y="5" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">?</text>
    `;
  }

  // Label position — to the right of symbol
  const labelColor = t === 'target' ? '#fca5a5' : t === 'friendly' ? '#93c5fd' : t === 'civilian' || t === 'protected' ? '#86efac' : t === 'unknown' ? '#fde68a' : '#fbbf24';
  return `
    <g transform="translate(${x} ${y})">
      ${body}
      <text x="20" y="-2" fill="${labelColor}" font-size="10" font-weight="700">${lbl}</text>
      ${sub ? `<text x="20" y="11" fill="#94a3b8" font-size="9">${sub}</text>` : ''}
    </g>
  `;
}

function ringSvg(cx, cy, radius_px, label, color, opacity = 0.7) {
  return `
    <circle cx="${cx}" cy="${cy}" r="${radius_px}" fill="none"
            stroke="${color}" stroke-width="1.5" stroke-dasharray="5 4" opacity="${opacity}"/>
    <text x="${cx}" y="${cy - radius_px - 4}" text-anchor="middle" fill="${color}" font-size="9" font-weight="600" opacity="${opacity + 0.2}">${label}</text>
  `;
}

function distLine(x1, y1, x2, y2, dist_m) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  return `
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
    <rect x="${mx - 22}" y="${my - 8}" width="44" height="14" fill="#0a1929" stroke="#fbbf24" stroke-width="0.5" rx="2"/>
    <text x="${mx}" y="${my + 2}" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">${dist_m}m</text>
  `;
}

function renderMap(map) {
  const m_per_px = map.view_size_m / MAP_W;
  // Place center entity (target) at (MAP_W/2, MAP_H/2). Other entities relative.
  const placed = map.entities.map((e, i) => {
    const [x, y] = e.center
      ? [MAP_W / 2, MAP_H / 2]
      : bearingToXY(e.bearing_deg || 0, e.dist_m || 0, m_per_px);
    return { ...e, x: clamp(x, 30, MAP_W - 30), y: clamp(y, 30, MAP_H - 30) };
  });

  // Find the "from" entity (usually target) for distance lines
  const target = placed.find(e => e.type === 'target' || e.type === 'unknown') || placed[0];

  let svg = '';
  // Topographic-style grid
  svg += `
    <defs>
      <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
        <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1e3a5f" stroke-width="0.5"/>
      </pattern>
      <marker id="vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#fca5a5"/>
      </marker>
    </defs>
    <rect width="${MAP_W}" height="${MAP_H}" fill="${map.night ? '#020617' : '#0a1929'}"/>
    <rect width="${MAP_W}" height="${MAP_H}" fill="url(#grid)"/>
  `;

  // Range rings (anchored to target by default)
  if (map.rings) {
    for (const r of map.rings) {
      const radius_px = r.radius_m / m_per_px;
      svg += ringSvg(target.x, target.y, radius_px, r.label, r.color, r.opacity || 0.7);
    }
  }

  // Distance lines from target to each friendly / protected
  for (const e of placed) {
    if (e === target) continue;
    if (e.type === 'friendly' || e.type === 'protected') {
      svg += distLine(target.x, target.y, e.x, e.y, e.dist_m || 0);
    }
  }

  // Entity symbols
  for (const e of placed) {
    svg += symbolSvg(e, e.x, e.y, m_per_px);
  }

  // Compass rose
  svg += `
    <g transform="translate(${MAP_W - 50} 45)">
      <circle r="22" fill="#0a1929" stroke="#475569" stroke-width="1"/>
      <text x="0" y="-8" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">N</text>
      <polygon points="0,-16 -3,-4 3,-4" fill="#fbbf24"/>
      <line x1="-13" y1="0" x2="13" y2="0" stroke="#475569" stroke-width="0.5"/>
      <line x1="0" y1="-13" x2="0" y2="13" stroke="#475569" stroke-width="0.5"/>
    </g>
  `;

  // Scale bar
  const scale_m = map.view_size_m >= 2000 ? 500 : map.view_size_m >= 1000 ? 200 : map.view_size_m >= 500 ? 100 : 50;
  const scale_px = scale_m / m_per_px;
  svg += `
    <g transform="translate(35 ${MAP_H - 25})">
      <line x1="0" y1="0" x2="${scale_px}" y2="0" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="${scale_px}" y1="-4" x2="${scale_px}" y2="4" stroke="#cbd5e1" stroke-width="2"/>
      <text x="${scale_px / 2}" y="-7" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="600">${scale_m}m</text>
    </g>
  `;

  // Header bar
  svg += `
    <rect x="0" y="0" width="${MAP_W}" height="22" fill="#1e293b" opacity="0.95"/>
    <text x="10" y="15" fill="#fbbf24" font-size="10" font-weight="700">${map.header || 'TACTICAL DISPLAY'}</text>
    <text x="${MAP_W - 10}" y="15" text-anchor="end" fill="#94a3b8" font-size="10">${map.timestamp || 'DTG: 1247Z'}</text>
  `;

  // Notes overlay
  if (map.notes) {
    svg += `<g transform="translate(35 35)">`;
    map.notes.forEach((n, i) => {
      svg += `<text x="0" y="${i * 14}" fill="#94a3b8" font-size="10" font-weight="500">${n}</text>`;
    });
    svg += `</g>`;
  }

  return `<svg viewBox="0 0 ${MAP_W} ${MAP_H}" class="map-svg w-full rounded">${svg}</svg>`;
}

// ──────────────────────────────────────────────────────────────────────────
// SCENARIOS — each carries: map, system rec, reasoning trace, grade questions
// ──────────────────────────────────────────────────────────────────────────

const SCENARIOS = [
  {

      { tree: 'Tree 2 — Munition', status: 'passed', text: 'GBU-12 PREFERRED for soft vehicle, friendly distance 800 m well outside 275 m danger close. JDAMs eliminated (need CAT-I coords; drone gives CAT-III).' },
      { tree: 'Tree 3 — Control type', status: 'passed', text: 'JTAC has no visual on aircraft → Type 1 unavailable. Drone has target → Type 2 (default for drone-fed CAS).' },
      { tree: 'Tree 4 — Mark', status: 'passed', text: 'Day + laser-guided weapon → drone laser designation, PRF 1688.' },
      { tree: 'Tree 5 — IP/Egress', status: 'passed', text: 'IP/egress: JTAC selects from named IP library; egress north away from no known threats.' },

      ],

    },

      remarks: ['Moving target: 25 kts hdg 270, time stamp 1247Z', 'TOT push when ready'],

    },

      { tree: 'Tree 2 — Munition', status: 'passed', text: 'GBU-12 dropped to MARGINAL on movers (laser hard to hold on moving target — AFTTP 6.3.4). AGM-65D promoted to PREFERRED — autonomous IIR seeker built for this.' },
      { tree: 'Tree 3 — Control type', status: 'passed', text: 'Type 2.' },

const KEY = 'jtac_feedback_v3';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { state = {}; }
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function ensureScenario(id) {
  state.scenarios = state.scenarios || {};
  state.scenarios[id] = state.scenarios[id] || { grades: {}, comments: {}, overall: null, openComment: '' };
  return state.scenarios[id];
}
let current = SCENARIOS[0].id;

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTabs() {
  const all = [
    ...SCENARIOS.map(s => ({ id: s.id, label: s.id })),
    { id: 'OPEN', label: "Open Q's" },
    { id: 'REVIEWER', label: 'About you' },
  ];
  document.getElementById('tabs').innerHTML = all.map(t =>
    `<button class="tab-btn px-3 py-1.5 text-sm rounded-md ${t.id === current ? 'active' : 'bg-white text-slate-700 hover:bg-slate-200 border border-slate-200'}" data-tab="${t.id}">${t.label}</button>`
  ).join('');
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.addEventListener('click', () => {
      current = b.getAttribute('data-tab');
      render();
      window.scrollTo(0, 0);
    });
  });
}

function renderNineLine(rec) {
  if (!rec.nine_line) {
    return `<div class="nine-line"><strong style="color:#fca5a5">NO 9-LINE — engagement blocked</strong><br/><br/>${esc(rec.blocked_reason || 'Engageability gate failed')}</div>`;
  }
  const nl = rec.nine_line;
  return `<div class="nine-line">
    <div><span class="label">L1 IP/BP</span> <span class="text-slate-500">— (JTAC fills)</span></div>
    <div><span class="label">L2 Heading</span> <span class="text-slate-500">— (JTAC fills)</span></div>
    <div><span class="label">L3 Distance</span> <span class="text-slate-500">— (JTAC fills)</span></div>
    <div><span class="label">L4 Elev.</span> ${esc(nl.l4)}</div>
    <div><span class="label">L5 Target</span> ${esc(nl.l5)}</div>
    <div><span class="label">L6 Loc.</span> ${esc(nl.l6)}</div>
    <div><span class="label">L7 Mark</span> ${esc(nl.l7)}</div>
    <div><span class="label">L8 Frnd</span> ${esc(nl.l8)}</div>
    <div><span class="label">L9 Egress</span> ${esc(nl.l9)}</div>
    ${rec.remarks && rec.remarks.length ? `<div class="border-t border-slate-700 my-2"></div>
    <div><span class="label">REMARKS</span></div>
    ${rec.remarks.map(r => `<div class="ml-3">• ${esc(r)}</div>`).join('')}` : ''}
    ${rec.restrictions && rec.restrictions.length ? `
    <div class="border-t border-slate-700 my-2"></div>
    <div><span class="label">RESTR</span></div>
    ${rec.restrictions.map(r => `<div class="ml-3 restriction">• ${esc(r)}</div>`).join('')}` : ''}
  </div>`;
}

function renderGradeRow(scenarioId, target) {
  const sState = ensureScenario(scenarioId);
  const cur = sState.grades[target];
  const comment = sState.comments[target] || '';
  const cls = (val, name) => `grade-btn ${name} ${cur === val ? 'on' : ''} border border-slate-300 rounded px-2 py-1 text-xs bg-white`;
  const label = target.replace(/_/g, ' ');
  return `<div class="border-l-4 border-slate-200 pl-3 py-2 mb-2">
    <div class="flex flex-wrap gap-2 items-center mb-1">
      <span class="font-medium text-sm text-slate-700 mr-2">${esc(label)}</span>
      <button class="${cls('up', 'up')}" data-grade="${esc(scenarioId)}|${esc(target)}|up">✓ Right</button>
      <button class="${cls('down', 'down')}" data-grade="${esc(scenarioId)}|${esc(target)}|down">✗ Wrong</button>
      <button class="${cls('unsure', 'unsure')}" data-grade="${esc(scenarioId)}|${esc(target)}|unsure">? Unsure</button>
    </div>
    <input type="text" placeholder="Comment / correction"
      class="w-full text-sm px-2 py-1 border border-slate-200 rounded bg-slate-50"
      value="${esc(comment)}"
      data-comment="${esc(scenarioId)}|${esc(target)}">
  </div>`;
}

function renderTrace(trace) {
  return trace.map(s => `
    <div class="trace-step ${s.status}">
      <div class="font-semibold text-slate-800">${esc(s.tree)} <span class="text-xs uppercase tracking-wider opacity-70">[${esc(s.status)}]</span></div>
      <div class="text-slate-700 mt-0.5">${esc(s.text)}</div>
    </div>
  `).join('');
}

function renderScenario(sc) {
  const sState = ensureScenario(sc.id);
  const blocked = !sc.rec.nine_line;

  const gradeRows = sc.grade_targets.map(t => renderGradeRow(sc.id, t)).join('');

  const overallBtn = (val, label, cls) => {
    const cur = sState.overall === val;
    return `<button data-overall="${esc(sc.id)}|${esc(val)}" class="${cur ? cls + ' text-white scale-105' : 'bg-white text-slate-700 hover:bg-slate-100'} border border-slate-300 px-4 py-2 rounded-md text-sm font-semibold transition">${esc(label)}</button>`;
  };

  const altsHtml = sc.rec.alternatives.length
    ? `<div class="px-4 py-2 border-t border-slate-700">
         <div class="tactical-header" style="background:transparent;border:none;padding:0 0 4px 0;">Alternatives</div>
         ${sc.rec.alternatives.map(a => `<div class="text-xs text-slate-300 mb-1">• <span class="text-amber-400 font-semibold">${esc(a.id)}</span> — ${esc(a.why)}</div>`).join('')}
       </div>`
    : '';

  const flagsHtml = sc.rec.flags && sc.rec.flags.length
    ? `<div class="px-4 py-2 border-t border-slate-700">
         <div class="tactical-header" style="background:transparent;border:none;padding:0 0 4px 0;">Flags</div>
         ${sc.rec.flags.map(f => `<span class="inline-block bg-amber-900 text-amber-200 border border-amber-700 text-xs px-2 py-0.5 rounded mr-1 mb-1 mono">${esc(f)}</span>`).join('')}
       </div>`
    : '';

  return `
    <article class="space-y-5">

      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="text-sm text-amber-600 font-semibold mono">SCENARIO ${esc(sc.id)}</div>
          <h2 class="text-2xl font-bold text-slate-900">${esc(sc.title)}</h2>
        </div>
        ${sState.overall ? `<div class="px-3 py-1 rounded-full text-xs font-semibold ${sState.overall === 'confirm' ? 'bg-green-100 text-green-800' : sState.overall === 'alter' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'}">${esc(sState.overall.toUpperCase())}</div>` : ''}
      </div>

      <!-- TACTICAL DISPLAY: map left, system rec right -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="lg:col-span-2 tactical-panel overflow-hidden">
          <div class="tactical-header">Tactical Map · what the JTAC sees</div>
          ${renderMap(sc.map)}
        </div>
        <div class="tactical-panel overflow-hidden">
          <div class="tactical-header">System Recommendation${blocked ? ' · BLOCKED' : ''}</div>
          <div class="px-4 py-3 space-y-2">
            <div>
              <div class="text-xs text-slate-400 uppercase tracking-wider">Munition</div>
              <div class="text-base font-bold text-amber-300">${esc(sc.rec.munition)}</div>
            </div>
            <div class="grid grid-cols-2 gap-2 text-sm">
              <div>
                <div class="text-xs text-slate-400 uppercase">Control</div>
                <div class="font-semibold">${esc(sc.rec.control_type)}</div>
              </div>
              <div>
                <div class="text-xs text-slate-400 uppercase">Method</div>
                <div class="font-semibold">${esc(sc.rec.method_of_attack)}</div>
              </div>
            </div>
            <div>
              <div class="text-xs text-slate-400 uppercase">Mark</div>
              <div class="text-sm">${esc(sc.rec.mark_method)}</div>
            </div>
          </div>
          ${altsHtml}
          ${flagsHtml}
        </div>
      </div>

      <!-- 9-LINE OUTPUT -->
      <div class="tactical-panel overflow-hidden">
        <div class="tactical-header">9-Line Brief · ready for JTAC review → GFC approval → aircraft</div>
        <div class="p-4">${renderNineLine(sc.rec)}</div>
      </div>

      ${blocked ? `
      <section class="bg-white border border-slate-200 rounded-lg p-5">
        <h3 class="font-semibold text-slate-900 mb-3">Grade the block decision</h3>
        ${renderGradeRow(sc.id, 'decision')}
        ${renderGradeRow(sc.id, 'remedy')}
      </section>
      ` : `
      <section class="bg-white border border-slate-200 rounded-lg p-5">
        <h3 class="font-semibold text-slate-900 mb-3">Grade each piece</h3>
        ${gradeRows}
      </section>

      <section class="bg-white border border-slate-200 rounded-lg p-5">
        <h3 class="font-semibold text-slate-900 mb-3">Overall — would you transmit this 9-line?</h3>
        <div class="flex gap-2">
          ${overallBtn('confirm', 'CONFIRM (transmit as-is)', 'bg-green-600')}
          ${overallBtn('alter', 'ALTER (with my edits)', 'bg-amber-500')}
          ${overallBtn('deny', 'DENY (do not engage)', 'bg-red-600')}
        </div>
      </section>
      `}

      <section class="bg-amber-50 border border-amber-200 rounded-lg p-5">
        <h3 class="font-semibold text-slate-900 mb-3">What we want from you on this scenario</h3>
        <ul class="list-disc list-inside text-sm text-slate-800 space-y-1 mb-3">
          ${sc.questions.map(q => `<li>${esc(q)}</li>`).join('')}
        </ul>
        <textarea rows="4" placeholder="Your answers / observations..."
          class="w-full text-sm px-3 py-2 border border-amber-300 rounded bg-white"
          data-opencomment="${esc(sc.id)}">${esc(sState.openComment || '')}</textarea>
      </section>

      <section class="bg-slate-100 border border-slate-300 rounded-lg p-5">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold text-slate-900">How the model decided</h3>
          <span class="text-xs text-slate-500">Reasoning trace through each of the 6 trees</span>
        </div>
        <div>${renderTrace(sc.trace)}</div>
      </section>

    </article>
  `;
}

function renderOpenQuestions() {
  return `
    <article class="space-y-4">
      <h2 class="text-2xl font-bold text-slate-900">Open doctrinal questions</h2>
      <p class="text-slate-600">Things doctrine doesn't fully answer. Skip any without a strong answer.</p>
      ${OPEN_QUESTIONS.map(q => `
        <section class="bg-white border border-slate-200 rounded-lg p-5">
          <div class="text-xs text-amber-600 font-semibold mono mb-1">${esc(q.id)} — ${esc(q.topic)}</div>
          <p class="text-slate-800 mb-3">${esc(q.body)}</p>
          <textarea rows="3" placeholder="Your answer..."
            class="w-full text-sm px-3 py-2 border border-slate-300 rounded bg-slate-50"
            data-openq="${esc(q.id)}">${esc(((state.openQuestions || {})[q.id]) || '')}</textarea>
        </section>
      `).join('')}
    </article>`;
}

function renderReviewer() {
  const r = state.reviewer || {};
  const field = (key, label) => `
    <div>
      <label class="text-sm text-slate-700 font-medium">${esc(label)}</label>
      <input type="text" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded text-sm"
        value="${esc(r[key] || '')}" data-reviewer="${esc(key)}">
    </div>`;
  return `
    <article class="space-y-4">
      <h2 class="text-2xl font-bold text-slate-900">About you</h2>
      <p class="text-slate-600">Helps us weight the feedback. Optional.</p>
      <section class="bg-white border border-slate-200 rounded-lg p-5 space-y-4">
        ${field('name', 'Name / call sign')}
        ${field('unit', 'Service / unit')}
        ${field('years', 'Years as JTAC / FAC(A) / JFO')}
        ${field('context', 'Most relevant deployment context')}
      </section>
    </article>`;
}

function render() {
  renderTabs();
  const main = document.getElementById('main');
  if (current === 'OPEN') main.innerHTML = renderOpenQuestions();
  else if (current === 'REVIEWER') main.innerHTML = renderReviewer();
  else {
    const sc = SCENARIOS.find(s => s.id === current);
    main.innerHTML = renderScenario(sc);
  }
  attachHandlers();
}

function attachHandlers() {
  document.querySelectorAll('[data-grade]').forEach(b => {
    b.addEventListener('click', () => {
      const [sid, target, val] = b.getAttribute('data-grade').split('|');
      const ss = ensureScenario(sid);
      ss.grades[target] = ss.grades[target] === val ? null : val;
      save();
      render();
    });
  });
  document.querySelectorAll('[data-comment]').forEach(i => {
    i.addEventListener('input', () => {
      const [sid, target] = i.getAttribute('data-comment').split('|');
      ensureScenario(sid).comments[target] = i.value;
      save();
    });
  });
  document.querySelectorAll('[data-overall]').forEach(b => {
    b.addEventListener('click', () => {
      const [sid, val] = b.getAttribute('data-overall').split('|');
      const ss = ensureScenario(sid);
      ss.overall = ss.overall === val ? null : val;
      save();
      render();
    });
  });
  document.querySelectorAll('[data-opencomment]').forEach(t => {
    t.addEventListener('input', () => {
      ensureScenario(t.getAttribute('data-opencomment')).openComment = t.value;
      save();
    });
  });
  document.querySelectorAll('[data-openq]').forEach(t => {
    t.addEventListener('input', () => {
      state.openQuestions = state.openQuestions || {};
      state.openQuestions[t.getAttribute('data-openq')] = t.value;
      save();
    });
  });
  document.querySelectorAll('[data-reviewer]').forEach(i => {
    i.addEventListener('input', () => {
      state.reviewer = state.reviewer || {};
      state.reviewer[i.getAttribute('data-reviewer')] = i.value;
      save();
    });
  });
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const name = ((state.reviewer && state.reviewer.name) || 'reviewer').replace(/\W+/g, '_');
  a.href = url;
  a.download = `jtac_feedback_${name}_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('copyBtn').addEventListener('click', async () => {
  await navigator.clipboard.writeText(JSON.stringify(state, null, 2));
  const b = document.getElementById('copyBtn');
  const orig = b.textContent;
  b.textContent = '✓ Copied';
  setTimeout(() => b.textContent = orig, 1500);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Reset all feedback?')) {
    state = {};
    localStorage.removeItem(KEY);
    render();
  }
});

render();
</script>
</body>
</html>
