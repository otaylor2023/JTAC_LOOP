# Munitions database — air-delivered weapons for CAS
#
# Sources cited per row:
#   WPNS = Air Force Weapons File (2012) at /REFERENCES/ORDNANCE/Weapons File (2012).pdf
#   JFIRE = JFIRE 2016 at /REFERENCES/ALSA PUBS/JFIRE (2016).pdf
#   JP3093 = JP 3-09.3 (2014) at /REFERENCES/JOINT PUBS/JP 3-09.3 Close Air Support (2014).pdf
#
# Field definitions:
#   class: bomb_lgb | bomb_jdam | bomb_unguided | bomb_sdb | missile_atgm | missile_em |
#          gun | rocket | missile_standoff | cluster
#   warhead_lb: warhead weight in pounds
#   warhead_type: HE_blast_frag | penetrator | thermobaric | shaped_charge | kinetic | cluster
#   guidance: laser | gps | gps_laser | ir | iir | electro_optical | anti_radiation | ballistic
#   red_standing_m: 0.1% Pᵢ Standing distance from JFIRE Table 86 (the danger-close threshold)
#   red_airburst_m: 0.1% Pᵢ Standing distance for airburst delivery, if differs (JFIRE Table 86)
#   msd_m: minimum safe distance for training, JFIRE Table 88. NOT used for combat danger close.
#   tle_required_m: max acceptable Target Location Error (90% confidence) to employ. From doctrine + sensible defaults.
#   fuze_options: nose | tail | dual | airburst_proximity | delay | hard_target_smart_fuze
#   delivery_aircraft: list of compatible platforms
#   target_classes_doctrinally_effective_against: list (used by effectiveness matrix)
#   restrictions: list of free-text restrictions (cite rules)
#   citation: doctrinal source

munitions:

  # ─── 500 lb LASER-GUIDED BOMBS (Paveway II family) ─────────────────────
  - id: GBU-12
    name: GBU-12 Paveway II
    class: bomb_lgb
    effectiveness_class: bomb_lgb_500
    warhead_lb: 500
    warhead_type: HE_blast_frag
    base_warhead: Mk-82
    guidance: laser
    red_standing_m: 275
    red_airburst_m: null
    msd_m: 1000
    tle_required_m: 30  # laser homing tolerates moderate TLE because the laser spot is the aimpoint
    fuze_options: [nose, tail, dual]
    delivery_aircraft: [A-10, F-15E, F-16, F/A-18, AV-8B, B-1, B-52, F-35, MQ-9]
    target_classes_doctrinally_effective_against:
      [vehicle_wheeled_soft, vehicle_tracked_light, structure_soft, personnel_concentrated, bunker_unhardened]
    restrictions:
      - "Requires line-of-sight from designator to target (smoke / heavy cloud below release alt defeats laser)"
      - "Effectiveness drops on movers above ~highway speed (AFTTP 6.3.4)"
