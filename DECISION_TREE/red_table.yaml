# ─── INDIRECT FIRE (JFIRE Tables 81-82, p.128-129) ─────────────────────────
# Note: indirect fire DANGER CLOSE for the call-for-fire format is a fixed trigger (600 m for arty/mortars,
# 750 m for naval gunfire) per ATP 3-09.30 ¶4-35. The table below is the actual 0.1% Pᵢ standing distance.
indirect_fire:
  M224_60mm_mortar: { red_standing_m: 145, danger_close_cff_trigger_m: 600 }
  M252_81mm_mortar: { red_standing_m: 195, danger_close_cff_trigger_m: 600 }
  M120_120mm_mortar: { red_standing_m: 430, danger_close_cff_trigger_m: 600 }
  105mm_M119_HE: { red_standing_m: 455, danger_close_cff_trigger_m: 600 }
  155mm_M109A6_M777_HE: { red_standing_m: 695, danger_close_cff_trigger_m: 600 }
  155mm_DPICM_M483A1: { red_standing_m: 510, danger_close_cff_trigger_m: 600 }
  155mm_RAP: { red_standing_m: 1045, danger_close_cff_trigger_m: 600 }
  Naval_5in_54_62: { red_standing_m: 595, danger_close_cff_trigger_m: 750 }
  TLAM: { red_standing_m: 300, danger_close_cff_trigger_m: 1000 }
  citation_for_all: "JFIRE Tables 81-85 pp.128-130; ATP 3-09.30 ¶4-35 for CFF trigger"

# ─── DECISION RULES ─────────────────────────────────────────────────────────
rules:
  trigger_danger_close:
    description: "Friendly distance is at or inside the RED standing distance for the chosen munition+fuze."
    condition: "friendly_distance_m <= red_standing_m"
    actions:
      - flag: "DANGER CLOSE"
      - require: "Ground Force Commander initials passed to aircrew via JTAC"
      - require: "Type 1 control IF VIABLE; if Type 1 blocked (GPS munition per JP 3-09.3 III-43), Type 2 with explicit DANGER CLOSE annotation"
      - prefer: "Weapon axis parallel to friendly orientation (reduces long/short fratricide risk)"
    citation: "JP 3-09.3 III-36, III-43; JFIRE Appendix H p.127"

  block_below_red:
    description: "If friendly distance is significantly below RED, flag for elevated review even with initials."
    condition: "friendly_distance_m < (0.5 * red_standing_m)"
    actions:
      - flag: "EXTREME DANGER CLOSE — system recommends munition substitution"
      - escalate: "GFC review elevated; recommend smaller-frag alternative"

  no_strike_protected_in_red:
    description: "If a hospital, school, mosque, or other Cat I no-strike site is within RED, BLOCK the munition."
    condition: "any(no_strike_site within red_standing_m radius)"
    actions:
      - block: "munition not viable — choose smaller-frag alternative"
    citation: "CJCSI 3160.01 Encl B"
