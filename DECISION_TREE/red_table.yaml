# Risk Estimate Distance — danger close threshold table
#
# Source: JFIRE 2016, Tables 81-87 (pp. 128-134)
# /REFERENCES/ALSA PUBS/JFIRE (2016).pdf
#
# Doctrinal definition of danger close (JP 3-09.3 III-36):
#   "Ordnance delivery inside the 0.1 percent Pᵢ distance will be considered 'danger close.'"
#   "Pᵢ" = probability of incapacitation. 0.1% = 1-in-1000 risk to a standing soldier in summer-weight uniform.
#
# Danger close procedure (JP 3-09.3 III-36):
#   "The supported commander must accept responsibility for the risk to friendly forces when targets are inside
#    the 0.1 percent Pᵢ distance. Risk acceptance is confirmed when the supported commander passes their initials
#    to the attacking CAS aircraft through the JTAC/FAC(A)."
#
# Use the STANDING column for danger-close trigger regardless of friendly posture (JFIRE p.127).
#
# How the decision tree uses this table:
#   if friendly_distance_m <= red_standing_m[munition]:
#     flag = "DANGER CLOSE"
#     require: ground_force_commander_initials
#     enforce: Type 1 control
#     record: weapon_axis_parallel_to_friendly_axis if possible (JP 3-09.3 III-36 quoted text)

