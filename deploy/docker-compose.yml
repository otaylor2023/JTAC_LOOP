# FreeTAKServer + Web UI (from FreeTAKHub-Installation example, with UI DB path fix).
# Usage: copy .env.example to .env, set FTS_IP to this host's LAN IP, then:
#   docker compose up -d
# Docs: https://freetakteam.github.io/FreeTAKServer-User-Docs/Installation/mechanism/Docker/overview/

services:
  freetakserver:
    image: ghcr.io/freetakteam/freetakserver:latest
    container_name: fts-freetakserver
    hostname: freetakserver
    env_file:
      - .env
    networks:
      - taknet
    volumes:
      - free-tak-core-db:/opt/fts/
    ports:
      - "8080:8080"
      - "8087:8087"
      - "8089:8089"
      - "8443:8443"
      - "9000:9000"
      - "19023:19023"
    environment:
      FTS_FED_PASSWORD: ${FTS_FED_PASSWORD:-defaultpass}
      FTS_CLIENT_CERT_PASSWORD: ${FTS_CLIENT_CERT_PASSWORD:-supersecret}
      FTS_WEBSOCKET_KEY: ${FTS_WEBSOCKET_KEY:-YourWebsocketKey}
      FTS_SECRET_KEY: ${FTS_SECRET_KEY:-vnkdjnfjknfl1232hashme}
      FTS_CONNECTION_MESSAGE: ${FTS_CONNECTION_MESSAGE:-Welcome to FreeTAKServer}
      FTS_COT_PORT: "8087"
      FTS_SSLCOT_PORT: "8089"
      FTS_API_PORT: "19023"
      FTS_FED_PORT: "9000"
      FTS_DP_ADDRESS: freetakserver
      FTS_USER_ADDRESS: freetakserver
      FTS_API_ADDRESS: freetakserver
      FTS_ROUTING_PROXY_SUBSCRIBE_PORT: "19030"
      FTS_ROUTING_PROXY_SUBSCRIBE_IP: freetakserver
      FTS_ROUTING_PROXY_PUBLISHER_PORT: "19032"
      FTS_ROUTING_PROXY_PUBLISHER_IP: freetakserver
      FTS_ROUTING_PROXY_SERVER_PORT: "19031"
      FTS_ROUTING_PROXY_SERVER_IP: freetakserver
      FTS_INTEGRATION_MANAGER_PULLER_PORT: "19033"
      FTS_INTEGRATION_MANAGER_PULLER_ADDRESS: freetakserver
      FTS_INTEGRATION_MANAGER_PUBLISHER_PORT: "19034"
      FTS_INTEGRATION_MANAGER_PUBLISHER_ADDRESS: freetakserver
      FTS_OPTIMIZE_API: "True"
      FTS_DATA_RECEPTION_BUFFER: "1024"
      FTS_MAX_RECEPTION_TIME: "4"
      FTS_NUM_ROUTING_WORKERS: "3"
      FTS_COT_TO_DB: "True"
      FTS_MAINLOOP_DELAY: "100"
      FTS_EMERGENCY_RADIUS: "0"
      FTS_LOG_LEVEL: info

  freetakserver-ui:
    image: ghcr.io/freetakteam/ui:latest
    container_name: fts-freetakserver-ui
    hostname: freetakserver-ui
    env_file:
      - .env
    networks:
      - taknet
    ports:
      - "5000:5000"
    volumes:
      - free-tak-ui-db:/home/freetak/:Z,rw
    environment:
      # Host/IP that *clients* use to reach this machine (LAN IP, not 127.0.0.1 for phones).
      # Used in templates/CORS as the FTS API host the *browser* connects to (Socket.IO on 19023).
      FTS_IP: ${FTS_IP:?Set FTS_IP in .env to your host LAN IP}
      FTS_API_PORT: "19023"
      FTS_API_PROTO: http
      # Bind address *inside the container* only. Must be 0.0.0.0 in Docker — if you put your LAN
      # IP here, eventlet fails with "Cannot assign requested address" (Errno 99) and the UI exits.
      FTS_UI_EXPOSED_IP: "0.0.0.0"
      # Browser loads the WebMap iframe from here; must be reachable from your workstation.
      FTS_MAP_EXPOSED_IP: ${FTS_IP}
      FTS_MAP_PORT: "8000"
      FTS_MAP_PROTO: http
      FTS_UI_PORT: "5000"
      FTS_UI_WSKEY: ${FTS_WEBSOCKET_KEY:-YourWebsocketKey}
      FTS_API_KEY: Bearer token
      # Avoid broken UI DB path (see FreeTAKHub-Installation issues).
      FTS_UI_SQLALCHEMY_DATABASE_URI: sqlite:////home/freetak/FTSServer-UI.db

volumes:
  free-tak-core-db:
  free-tak-ui-db:

networks:
  taknet:
    driver: bridge
